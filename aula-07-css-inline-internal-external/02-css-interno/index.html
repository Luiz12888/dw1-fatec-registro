<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Internal</title>
    <style>
      p{
        color: #f87575;
        font-size: 18px;
      }

      .destaque{
        background-color: #125096;
        color: #ffffff;
        padding: 10px;
        border-left: 4px solid orange;
      }
      #principal {
         border: 2px solid orange;
         padding: 20px;
         margin: 20px;
      }
    </style>
</head>
<body>
    <h1>Demonstração parágrafo de CSS Internal</h1>
    <p>este parágrafo é utilizado</p>
      <br> através do CSS Internal, definido no head.
    
      </p>

      <p class="destaque">
         Este parágrafo possui uma classe "destaque" e recebe estilos específicos.
        

      </p>
      <section id="principal">

        <h2 style="color: blue;">Seção principal</h2>
        <p style="color: blue;">Esta seção possui ID (#) "principal" é estilizado de forma única.</p>
      </section>
</body>
</html>
