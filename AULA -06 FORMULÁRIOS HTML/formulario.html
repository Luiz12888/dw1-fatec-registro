<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
     <h1>Formulários no HTML5</h1>
     <form  action="#" method="post">
        <label for="nome">Nome:</label> <br>
        <!-- INPUT TEXT -->
         <input name="Nome"type="text" id="nome" placeholder="Insira seu nome completo..."><br>
         <!-- INPUT EMAIL -->
          <label for="email">E-mail:</label> <br>
          <input name="email" id="email" placeholder="Insira seu email..."><br>
          <!-- INPUT SENHA -->
           <label for="password">password:</label><br>
           <input name="Senha" type="password" id="password" placeholder="Insira sua senha..."><br>
           <br>
           <!-- BOTÃO DE SUBMETER FORMULÁRIO -->
            <input type="submit" value="Cadastrar">
            <!-- BOTÃO LIMPAR FORMULÁRIO -->
             <input type="reset" value="Limpar">
      </form>

           <br><br>
           <hr>
           <h4>Outros inputs:</h4>
     <form>
        <label>Quantidade </label> <br>
           <!-- INPUT DE NÚMEROS --> 
            <input type="number" min="0" max="10"/> <br>
            <label></label>Data:</label> <br>
            <!-- INPUT DE DATAS -->
             <input type="date"/> <br><br>
             <!-- INPUT ARQUIVOS -->
              <input type="file"/> <br><br>
              <!-- campo de texto longo -->
               <label>Comentários</label> <br><br>
               <textarea rows="4" cols="40"></textarea>
               <!-- campo invisível -->
                <input type="hidden" name="idProduto" value="9"/> <br>
                <!-- caixa de seleção -->
                 <label>Cursos:</label> <br>
                 <select name="cursos" >
                    <option value="1">Programação</option>
                    <option value="2">Design Gráfico</option>
                    <option value="3">Música</option>
                    <option value="4">Enfermagem</option>

                 </select>

        </form>
        <br><br>
        <hr>
        <h2>Exemplo formulário completo:</h2>
        <!-- FORMULÁRIO COMPLETO -->
         <h4>Cadastro do usuário</h4>
         <form action="#" method="post"></form>
           <fieldset>
             <legend>Dados Pessoais:</legend>
             <label for="nome">Nome:</label>
             <input type="text" placeholder="Insira seu nome" id="Name" name="name" required>
             <br>
             <label for="Nascimento">Data de nascimento:</label>
             <input type="date"><br>
             <label for="sexo">Sexo:</label>
             <!-- radio buttons -->
              <input type="radio" name="sexo">Masculino
              <input type="radio" name="sexo">Feminino
              <input type="radio" name="sexo">Prefiro não informar
           </fieldset>
           <br>
           <fieldset>
             <legend>Dados de endereço</legend>
             <label for="rua">Rua:</label>
             <input type="text">
             <label for="numero">Número:</label>
             <input type="number">
           </fieldset>
           <br>
            <fieldset>
                <legend>Dados do Produto</legend>
                <label> Cor do Produto:</label>
                <input type="color">
                <!-- CHECKBOX -->
                 <input type="text" placeholder="Este campo esta desativado" disabled>
                 <input type="checkbox" required> Li e aceito os termos de uso 
                 <br><br>
                 <input type="submit" value="Cadastrar">
                 <input type="reset" value="Limpar">
            </fieldset>



        
</body>
</html>
